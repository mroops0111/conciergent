# Create a Slack app from this manifest at https://api.slack.com/apps (Create New App, From a manifest).
# Replace YOUR-PUBLIC-URL with the public URL your conciergent server is reachable at.
#
# conciergent replies to users in direct messages, through the message.im event below.
# The in-chat OAuth authorization for MCP tools also happens in that DM.
# Channels are opt-in through surface.slack.groups. Uncomment the app_mention lines to answer mentions there.
display_information:
  name: My conciergent bot
features:
  bot_user:
    display_name: my-conciergent-bot
    always_online: true
oauth_config:
  redirect_urls:
    - https://YOUR-PUBLIC-URL/oauth/slack/callback
  scopes:
    bot:
      - chat:write
      - im:history
      - im:read
      - im:write
      - users:read
      # - app_mentions:read # group chats, reply_to: mention
settings:
  event_subscriptions:
    request_url: https://YOUR-PUBLIC-URL/slack/events
    bot_events:
      - message.im
      # - app_mention # group chats, reply_to: mention
  interactivity:
    is_enabled: true
    request_url: https://YOUR-PUBLIC-URL/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
